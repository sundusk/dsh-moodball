# dsh-moodball-status bundle patch: inserts the host-only plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add github:sundusk/dsh-moodball`.
#
# The row is a bare plugin by package name: the node half (exports ".") tracks
# agent activity and serves /api/moodball/status for the MoodBall desktop app.
# There is no browser half and no settings namespace, so nothing needs host
# whitelist support.
- insert:
    - id: moodball
      name: '@sundusk/dsh-moodball-status'
